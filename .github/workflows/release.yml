name: release

# Build the single-binary Go tool for each OS/arch and attach the binaries to
# a GitHub Release. Runs when you push a version tag (e.g. v0.1.0); a manual
# run just builds (and skips the release step) so you can check it compiles.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # required to create the Release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: go/go.sum

      - name: Test
        working-directory: go
        run: go test ./...        # fast unit tests; the browser smoke test is behind -tags smoke

      - name: Build binaries
        working-directory: go
        run: |
          set -euo pipefail
          mkdir -p dist
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os="${t%/*}"; arch="${t#*/}"
            out="dist/relinked_${os}_${arch}"
            [ "$os" = windows ] && out="$out.exe"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "$out" .
          done
          ls -la dist

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: go
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
