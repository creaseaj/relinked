name: release

# Build the single-binary Go tool for each OS/arch and attach the binaries to
# a GitHub Release. Runs when you push a version tag (e.g. v0.1.0), or from a
# manual "Run workflow" where you type the version - handy when you can't push
# a tag directly. The manual run creates the tag at the chosen commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag and release, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write   # required to create the Release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: go/go.sum

      - name: Test
        working-directory: go
        run: go test ./...        # fast unit tests; the browser smoke test is behind -tags smoke

      - name: Build binaries
        working-directory: go
        run: |
          set -euo pipefail
          mkdir -p dist
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os="${t%/*}"; arch="${t#*/}"
            out="dist/relinked_${os}_${arch}"
            [ "$os" = windows ] && out="$out.exe"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "$out" .
          done
          ls -la dist

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        working-directory: go
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # Tag push: use the pushed tag. Manual run: use the typed version and
          # create that tag at this commit (passed via env, never inlined, so a
          # version string can't be injected into the shell).
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          echo "Releasing $VERSION"
          gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes --target "$GITHUB_SHA"
